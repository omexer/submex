name: Deploy to WordPress.org

# A release made by the Release workflow's token cannot start another workflow, so this follows the run instead.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to deploy, such as 1.1.2'
        required: true
      dry_run:
        description: 'Check everything and show what would change, but commit nothing to WordPress.org'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    # A Release run started by hand is a dry run, and a failed one published nothing.
    if: github.event_name == 'workflow_dispatch' || ( github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

    steps:
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT:-${TAG#v}}"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$version' is not a version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Credentials
        id: credentials
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::warning::The SVN_USERNAME and SVN_PASSWORD secrets are not set, so nothing was deployed to WordPress.org."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # Only the listing images come from this checkout, and they follow main rather than the tag.
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'yes'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Unpack the released zip
        if: steps.credentials.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "submex-$VERSION.zip" --pattern "submex-$VERSION.zip.sha256"
          sha256sum -c "submex-$VERSION.zip.sha256"
          unzip -q "submex-$VERSION.zip" -d package
          test -f package/submex/submex.php
          grep -qx "Stable tag: $VERSION" package/submex/readme.txt || { echo "::error::readme.txt does not say Stable tag: $VERSION"; exit 1; }

      - name: Deploy
        if: steps.credentials.outputs.ready == 'yes'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.dry_run == true }}
        env:
          SLUG: submex
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ runner.temp }}/package/submex
          ASSETS_DIR: .wordpress-org
